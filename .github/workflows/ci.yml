name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest
        # Settings requires DATABASE_URL and SECRET_KEY with no defaults and
        # .env is gitignored, so CI provides dummy values. The test suite
        # itself runs on in-memory SQLite (see app/tests/conftest.py); these
        # are fixtures, not secrets.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          SECRET_KEY: ci-only-dummy-secret-key-0123456789abcdef

      - name: Print canonical layout benchmark table
        run: |
          python scripts/benchmark_mvp_engine.py
          python scripts/benchmark_hierarchical_archetypes.py
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          SECRET_KEY: ci-only-dummy-secret-key-0123456789abcdef

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The real frontend and backend against a real Postgres. Only the LLM is
    # replaced (frontend/e2e/fake-llm.mjs), so runs are deterministic and free.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archiai
          POSTGRES_PASSWORD: archiai
          POSTGRES_DB: archiai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archiai -d archiai_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database in the service container above; not a secret.
      E2E_DATABASE_URL: postgresql+asyncpg://archiai:archiai@localhost:5432/archiai_e2e
      E2E_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
